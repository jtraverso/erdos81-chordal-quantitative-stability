fidelity:
  divergences: >-
    Graphs are SimpleGraphs on Fin n. A clique partition is a finite family of cliques with at least
    two vertices, pairwise edge-disjoint and covering every edge; c₄ is expressed through
    partitions of order at most four (no minimum function is defined: the statements supply
    witnesses or quantify over all partitions), and cp(G) = t through CliqueCoverEq. Theorem B's
    maximum is stated as the existence, for each large n, of a chordal graph with an order-four
    partition of size M(n) that is optimal among all clique partitions, together with the upper
    bound. Theorem 6.1 uses the explicit constants of the formal companion (117/1825, 12687/20000,
    16) and γ = 10⁻¹⁶/4. Rooted simplicial defect, the templates and Q_s(n) follow the paper's
    definitions as written in the Challenge; c₄ = Q_s(n) and cp = Q_s(n) are expressed by witnesses
    and lower bounds over all partitions; Theorem 6.5 is stated for sequences of graphs with
    Filter.atTop and little-o (Asymptotics). In Theorem 3.1 the gains are 2 for a triangle and 5 for a K₄, a fractional
    packing has load at most 1 on every edge of G, and a physical packing is a family of
    edge-disjoint triangles and K₄'s of G.

