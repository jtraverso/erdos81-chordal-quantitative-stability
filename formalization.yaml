version: "v0.4"

project:
  name: "Clique partitions of chordal graphs: quantitative stability and sharp eventual bounds"
  description: >-
    A Lean 4 / Mathlib formalization of the chordal results of the author's preprint "Clique
    partitions with rooted simplicial defect: quantitative stability and sharp eventual bounds"
    (Erdős #81 series, Paper IV). With M(n) = ⌊n(n+1)/6⌋: there is b such that every chordal graph
    on n vertices has a clique partition into pieces of order at most four with at most M(n) + b
    pieces (Theorem A); for n large every chordal graph on n vertices has one with at most M(n)
    pieces, and some chordal graph on n vertices has one with exactly M(n) pieces that is optimal
    among all clique partitions (Theorem B, the bound asked in Erdős Problem #81 and its sharpness);
    1/6 is the least quadratic coefficient (§6.3); the uniform mixed rounding of fractional
    triangle/K₄ packings (Theorem 3.1); integral stability with explicit constants and edit
    distance at most 16δ to a complete-split graph, for 0 ≤ δ ≤ γn² with γ = 10⁻¹⁶/4 (Theorem
    6.1); same-root control of near-optimal partitions, at most τ + 48δ noncanonical pieces
    (Corollary 6.1a); the root-defect identity (6.7b); and the eventual classification of the
    extremal chordal graphs as complete-split graphs with a core of optimal size (Corollary 6.2).
    Eight statements. The thresholds N are existential; b and N are not claimed optimal.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

