version: "v0.4"

project:
  name: "Clique partitions of chordal graphs: quantitative stability and sharp eventual bounds"
  description: >-
    A Lean 4 / Mathlib formalization of the chordal results of the author's preprint "Clique
    partitions with rooted simplicial defect: quantitative stability and sharp eventual bounds"
    (Erdős #81 series, Paper IV). With M(n) = ⌊n(n+1)/6⌋: there is b such that every chordal graph
    on n vertices has a clique partition into pieces of order at most four with at most M(n) + b
    pieces (Theorem A); for n large every chordal graph on n vertices has one with at most M(n)
    pieces, and some chordal graph on n vertices has one with exactly M(n) pieces that is optimal
    among all clique partitions (Theorem B, the bound asked in Erdős Problem #81 and its sharpness);
    1/6 is the least quadratic coefficient (§6.3); the uniform mixed rounding of fractional
    triangle/K₄ packings (Theorem 3.1); integral stability with explicit constants and edit
    distance at most 16δ to a complete-split graph, for 0 ≤ δ ≤ γn² with γ = 10⁻¹⁶/4 (Theorem
    6.1); same-root control of near-optimal partitions: one clique root satisfies all the
    conclusions of Theorem 6.1 and, for it, every partition with at most M(n) + τ pieces has at
    most τ + 48δ noncanonical pieces (Corollary 6.1a); the root-defect identity (6.7b); and the eventual classification of the
    extremal chordal graphs as complete-split graphs with a core of optimal size (Corollary 6.2).
    Version 2 adds the fixed-defect results for graphs of rooted simplicial defect at most s:
    the sharp eventual bound Q_s(n) = M(n + s) − C(s + 1, 2), attained by a partition optimal among
    all clique partitions (Theorem C); same-root stability with A_s = 2·10⁴¹·(s + 1)⁸ for
    0 ≤ δ ≤ γn², edit distance at most A_s δ, at most τ + (1 + 7A_s)δ noncanonical pieces carrying
    at most 10τ + 10(1 + 7A_s)δ edges (Theorem C′); comparison with an optimal-size template at
    distance at most A_s δ + n√((1 + 4A_s)δ) and the equality case cp = c₄ = Q_s(n) (Corollary 6.3);
    the necessity of the square-root term (Proposition 6.3a); the bounds F₄(G) ≤ M(n − s) + ns
    (minus C(s + 1, 2) when 4s ≤ n) and their integral form up to εn² (Proposition 6.4); the
    sublinear-defect bound n²/6 + o(n²) and root stability (Theorem 6.5); the bound Q_s(n) for all
    s ≤ S once n ≥ T(P(S)), an explicit tower (Corollary 6.6); and the annex inequality: a chordal
    K_{d+2}-free graph has fractional triangle packing number at most ν₃ + (10 + d/2)n (G.1).
    21 statements. The thresholds N and γ in Theorems B, C, C′ and Corollary 6.3 are existential;
    b, N, A_s and the tower are not claimed optimal.
  authors:
    - "Juan Pablo Traverso Gianini"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Juan Pablo Traverso Gianini"

