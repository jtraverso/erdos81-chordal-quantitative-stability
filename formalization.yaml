status:
  scope: >-
    The eight statements are proved for every finite simple graph on Fin n (Theorems A, B, 6.1,
    6.2 and the quadratic coefficient for chordal graphs; Theorem 3.1 for all graphs; identity
    (6.7b) for every finite vertex type). Known gaps relative to the paper: Theorem C, Theorem C′,
    Corollary 6.3, Proposition 6.3a and the uniform bounds of §6.7 (Proposition 6.4, Theorem 6.5,
    Corollary 6.6) are proved in the freeze but not yet ported; Corollary 3.5, Theorem 5.0,
    Corollary 5.4 and Proposition D.3 are proved in the library but not stated in the Challenge;
    the bounded-clique-gap annex is not included.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

