status:
  scope: >-
    The 21 statements are proved for finite simple graphs on Fin n (Theorems A, B, 6.1, 6.2 and the
    quadratic coefficient for chordal graphs; Theorems C, C′, 6.5, Corollaries 6.3, 6.6 and
    Propositions 6.3a, 6.4 for graphs of bounded or sublinear rooted simplicial defect; Theorem 3.1
    for all graphs; identity (6.7b) and (G.1) for every finite vertex type). Known gaps relative to
    the paper: Corollary 3.5, Theorem 5.0, Corollary 5.4 and Proposition D.3 are proved in the
    library but not stated in the Challenge. Version 2 adds 13 statements; the eight of version 1
    and their definitions are unchanged.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

